# The Integrations page's rows (docs/how-to/integrations.md), kept by hand:
# one per released plugin, public under github.com/open-meridian, with a
# release on its main. Nothing planned or unreleased.
#
# tools/integrations_page.py checks every row at each build: its fields and
# their allowed values, and its roles, version and contract against
# released.json, the snapshot of each plugin's main pyproject.toml that
#
#     python tools/integrations_page.py refresh
#
# writes. A row that drifts from its plugin's release fails the build.
#
# Fields:
#   service       the service the plugin works with, as the page names it
#   plugin        its repository under github.com/open-meridian
#   roles         data, custody, connectivity, confirmation, operations, reporting
#   assets        equity, fund, debt, derivative, crypto, event-contract, fx, cash:
#                 what the plugin's README and catalogue state it covers; a
#                 class they leave unclear is left out
#   environments  sandbox, live, sample-data, as the plugin's settings offer them:
#                 sandbox and live from an environment setting, live alone where
#                 the plugin calls only the service itself, sample-data from the
#                 SDK's developer setting `sample_data`
#   status        preview or released, the contract's stability words
#   version       [project] version on main
#   contract      the contract the pinned SDK declares (meridian.SCHEMA_VERSION)
#   guide         optional: the plugin's how-to page in these docs, a path under
#                 docs/ with an optional #anchor; without it, the page links the
#                 repository's README

# Data: mutual funds' daily NAVs (README, "What it records": "Only mutual
# funds"). Settings: an API token, sample_data. README: "not released yet".
- service: Tiingo
  plugin: plugin-tiingo
  roles: [data]
  assets: [fund]
  environments: [live, sample-data]
  status: preview
  version: "0.4.0"
  contract: 22
  guide: how-to/using-a-data-plugin.md#tiingo-mutual-funds-daily-navs

