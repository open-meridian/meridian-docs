site_name: Open Meridian
site_description: Documentation for Open Meridian, the open-source OEMS. Own your trading stack, and build on it yourself or with AI agents.
site_url: https://open-meridian.dev
repo_url: https://github.com/open-meridian/meridian-core
repo_name: open-meridian/meridian-core
edit_uri: https://github.com/open-meridian/meridian-docs/edit/main/docs/
# The docs licence (ruling 534): the prose CC BY 4.0, the code samples
# Apache-2.0, in LICENSE and LICENSE-CODE. No copyright holder is named yet.
copyright: >-
  Text licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>;
  code samples under <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache-2.0</a>.

# The theme's fonts are fetched at build time and served from this site, so a
# visitor's browser asks no third party for anything (the privacy plugin).
plugins:
  - search
  - privacy

# The roles page (concepts/roles.md), the data dictionary's store pages
# (boundaries/<store>.md) and llms.txt are generated at every build
# from boundaries/, meridian-schema's published roles, and llms.txt is checked
# against the built site. See tools/boundaries_page.py.
hooks:
  - tools/boundaries_page.py
  # The Integrations page's table (how-to/integrations.md), from
  # integrations/integrations.yaml, each row checked against the snapshot of
  # its plugin's release in integrations/released.json. See
  # tools/integrations_page.py.
  - tools/integrations_page.py

# The header logo is the mark in white, for the navy header. The tab icon is
# meridian-design's brand/ favicon set: favicon.svg turns from indigo to soft
# indigo on a dark tab by itself; overrides/main.html links the PNG, the SVG
# again typed and last, and the home-screen icon; docs/favicon.ico answers
# /favicon.ico.
theme:
  name: material
  custom_dir: overrides
  logo: assets/mark.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

# The Integrations page's filters; without it the page shows its whole table.
extra_javascript:
  - javascripts/integrations.js

extra:
  homepage: https://open-meridian.com
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/open-meridian

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

